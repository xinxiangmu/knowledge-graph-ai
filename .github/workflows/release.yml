name: Release Plugin

on:
  push:
    tags:
      - '*'

env:
  PLUGIN_NAME: knowledge-graph-ai

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release files
        run: |
          test -f main.js || (echo "ERROR: main.js not found" && exit 1)
          test -f manifest.json || (echo "ERROR: manifest.json not found" && exit 1)
          test -f styles.css || (echo "ERROR: styles.css not found" && exit 1)
          echo "All release files verified"
          ls -la main.js manifest.json styles.css

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed

            Automated release for version ${{ github.ref_name }}

            ### Files included:
            - `main.js` - Plugin main file
            - `manifest.json` - Plugin metadata
            - `styles.css` - Plugin styles

            ### Installation:
            1. Download the files from the Assets below
            2. Create a folder named `${{ env.PLUGIN_NAME }}` in your Obsidian plugins directory
            3. Copy the files into the folder
            4. Enable the plugin in Obsidian settings
          draft: false
          prerelease: false
          files: |
            main.js
            manifest.json
            styles.css